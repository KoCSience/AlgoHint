[project]
name = "algohint"
version = "0.1.0"
description = "A local-first algorithm practice coach with safe, staged hints"
readme = "README.md"
authors = [
    { name = "KoCSience", email = "90507944+KoCSience@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.20.0",
    "pydantic>=2.13.4",
]

[project.scripts]
algohint = "algohint:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
