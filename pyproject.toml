[project]
name = "algohint"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KoCSience", email = "90507944+KoCSience@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.20.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
algohint = "algohint:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
