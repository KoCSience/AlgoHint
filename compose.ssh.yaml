name: algohint-ssh

services:
  app:
    image: algohint:ssh-local
    build:
      context: .
      target: runtime
    # The host owns the SSH tunnel. Host networking lets the container use its
    # loopback endpoint without mounting SSH keys or widening the tunnel.
    network_mode: host
    init: true
    environment:
      ALGOHINT_ENV:
      ALGOHINT_LLM_PROVIDER:
      ALGOHINT_OPENAI_MODEL:
      ALGOHINT_GEMINI_MODEL:
      ALGOHINT_GEMMA_MODEL:
      ALGOHINT_GEMMA_TIMEOUT_SECONDS:
      OPENAI_API_KEY:
      GEMINI_API_KEY:
      ALGOHINT_GEMMA_API_KEY:
      ALGOHINT_GEMMA_BACKEND: transformers_http
      ALGOHINT_GEMMA_DEPLOYMENT: remote
      ALGOHINT_GEMMA_BASE_URL: http://127.0.0.1:18000/v1
    volumes:
      - runtime-data:/opt/algohint/data/runtime
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s
    command:
      - --host
      - 127.0.0.1
      - --port
      - "7860"
      - --data-dir
      - /opt/algohint/data

volumes:
  runtime-data:
    name: algohint-runtime
